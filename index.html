<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SKITZ AI</title>
<style>
:root {
  --bg: #080b12;
  --panel: #101725;
  --blue: #3987ff;
  --text: #f4f7ff;
  --muted: #9ba9bd;
  --border: #202c40;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
  height: 100vh;
  display: flex;
}
.sidebar {
  width: 235px;
  padding: 20px;
  background: #0c111c;
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.logo {
  font-size: 25px;
  font-weight: 900;
  margin-bottom: 18px;
}
.logo span { color: var(--blue); }
button {
  border: 0;
  cursor: pointer;
  border-radius: 9px;
  padding: 12px;
  font-weight: bold;
  font-size: 14px;
}
.sidebar button {
  background: #151e2e;
  color: var(--text);
  text-align: left;
}
.sidebar button.active {
  background: var(--blue);
}
.status {
  margin-top: auto;
  color: #77e3a5;
  font-size: 12px;
}
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
}
header {
  height: 65px;
  display: flex;
  align-items: center;
  padding: 0 24px;
  border-bottom: 1px solid var(--border);
  font-weight: bold;
}
#messages {
  flex: 1;
  overflow-y: auto;
  padding: 25px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.welcome {
  margin: auto;
  text-align: center;
  max-width: 500px;
}
.welcome h1 { font-size: 36px; }
.blue { color: var(--blue); }
.message {
  max-width: 820px;
  width: fit-content;
  padding: 14px 17px;
  border-radius: 13px;
  line-height: 1.55;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.user {
  align-self: flex-end;
  background: #1b3e70;
}
.assistant {
  align-self: flex-start;
  background: var(--panel);
  border: 1px solid var(--border);
}
.composer {
  padding: 18px 24px 24px;
  border-top: 1px solid var(--border);
}
.input-row {
  display: flex;
  gap: 10px;
  max-width: 900px;
  margin: auto;
}
input {
  flex: 1;
  min-width: 0;
  background: var(--panel);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 15px;
  font-size: 15px;
  outline: none;
}
input:focus { border-color: var(--blue); }
#send {
  background: var(--blue);
  color: white;
  min-width: 75px;
}
#send:disabled { opacity: .6; cursor: wait; }
.hint {
  text-align: center;
  color: var(--muted);
  font-size: 11px;
  margin-top: 10px;
}
@media(max-width:600px) {
  .sidebar { width: 75px; padding: 10px; }
  .logo { font-size: 14px; }
  .sidebar button { font-size: 11px; padding: 10px 5px; }
  .status { font-size: 10px; }
  header { padding: 0 14px; }
  #messages { padding: 15px; }
  .composer { padding: 12px; }
  .welcome h1 { font-size: 27px; }
}
</style>
</head>
<body>

<aside class="sidebar">
  <div class="logo">SKITZ<span> AI</span></div>
  <button id="newChat" type="button">＋ New Chat</button>
  <button id="chatMode" class="active" type="button">💬 AI Chat</button>
  <button id="devMode" type="button">💻 Developer AI</button>
  <div class="status">● SKITZ AI</div>
</aside>

<main class="main">
  <header id="header">💬 AI Chat</header>

  <section id="messages" aria-live="polite">
    <div class="welcome" id="welcome">
      <h1>What's up? <span class="blue">👋</span></h1>
      <p style="color:var(--muted)">
        Welcome to SKITZ AI. What are we working on today?
      </p>
    </div>
  </section>

  <div class="composer">
    <div class="input-row">
      <input id="prompt" type="text"
        placeholder="Ask SKITZ AI anything..."
        autocomplete="off">
      <button id="send" type="button">Send</button>
    </div>
    <div class="hint">SKITZ AI can make mistakes. Check important information.</div>
  </div>
</main>

<script>
"use strict";

const API_URL = "https://skitz-ai.howell-kareem67.workers.dev";
let currentMode = "chat";
let isSending = false;

const input = document.getElementById("prompt");
const sendButton = document.getElementById("send");
const messages = document.getElementById("messages");

function setMode(mode) {
  currentMode = mode;

  document.getElementById("chatMode").classList.toggle("active", mode === "chat");
  document.getElementById("devMode").classList.toggle("active", mode === "dev");

  document.getElementById("header").textContent =
    mode === "chat" ? "💬 AI Chat" : "💻 Developer AI";

  input.placeholder = mode === "chat"
    ? "Ask SKITZ AI anything..."
    : "Ask about coding, Roblox, or game development...";

  input.focus();
}

function addMessage(text, type) {
  const welcome = document.getElementById("welcome");
  if (welcome) welcome.remove();

  const message = document.createElement("div");
  message.className = "message " + type;
  message.textContent = text;
  messages.appendChild(message);
  messages.scrollTop = messages.scrollHeight;
}

async function sendMessage() {
  const text = input.value.trim();

  if (!text || isSending) return;

  addMessage(text, "user");
  input.value = "";
  isSending = true;
  sendButton.disabled = true;
  sendButton.textContent = "...";

  try {
    const instructions = currentMode === "dev"
      ? "You are SKITZ AI Developer Mode. Help with programming, Roblox development, Lua, UI design, debugging, and game development. Explain clearly and casually."
      : "You are SKITZ AI, a helpful assistant. Be friendly, clear, and useful. Use a casual style.";

    const response = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        message: instructions + "\n\nUser message: " + text
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Request failed with status " + response.status);
    }

    if (typeof data.reply !== "string" || !data.reply.trim()) {
      throw new Error("The server returned no reply.");
    }

    addMessage(data.reply, "assistant");

  } catch (error) {
    console.error("SKITZ AI error:", error);
    addMessage(
      "I couldn't connect to SKITZ AI. Please check the internet connection and Cloudflare Worker. If the problem continues, check the browser console for the error.",
      "assistant"
    );
  } finally {
    isSending = false;
    sendButton.disabled = false;
    sendButton.textContent = "Send";
    input.focus();
  }
}

function newChat() {
  messages.innerHTML = `
    <div class="welcome" id="welcome">
      <h1>What's up? <span class="blue">👋</span></h1>
      <p style="color:var(--muted)">
        Welcome to SKITZ AI. What are we working on today?
      </p>
    </div>
  `;
  input.value = "";
  input.focus();
}

document.getElementById("chatMode").addEventListener("click", () => setMode("chat"));
document.getElementById("devMode").addEventListener("click", () => setMode("dev"));
document.getElementById("newChat").addEventListener("click", newChat);
sendButton.addEventListener("click", sendMessage);

input.addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.isComposing) {
    event.preventDefault();
    sendMessage();
  }
});
</script>

</body>
</html>
