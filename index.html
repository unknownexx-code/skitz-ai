<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SKITZ AI</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #080b12;
  color: white;
}

.app {
  display: flex;
  min-height: 100vh;
}

.sidebar {
  width: 240px;
  background: #0d111b;
  border-right: 1px solid #20283a;
  padding: 22px 15px;
}

.logo {
  font-size: 25px;
  font-weight: bold;
  color: #3399ff;
  margin-bottom: 30px;
}

.new-chat, .mode {
  width: 100%;
  padding: 13px;
  margin-bottom: 10px;
  border: 1px solid #26344b;
  border-radius: 10px;
  background: #131b2a;
  color: white;
  cursor: pointer;
  text-align: left;
}

.mode.active, .new-chat:hover {
  background: #123b68;
  border-color: #3399ff;
}

.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
}

header {
  padding: 20px;
  border-bottom: 1px solid #20283a;
  font-weight: bold;
}

#messages {
  flex: 1;
  padding: 25px;
  overflow-y: auto;
  max-width: 900px;
  width: 100%;
  margin: 0 auto;
}

.welcome {
  text-align: center;
  margin: 100px auto 40px;
}

.welcome h1 {
  font-size: 38px;
}

.blue {
  color: #3399ff;
}

.message {
  background: #111927;
  border: 1px solid #202e43;
  padding: 15px;
  border-radius: 12px;
  margin: 12px 0;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  line-height: 1.5;
}

.user {
  border-color: #1768ad;
  background: #10243a;
}

.input-area {
  padding: 18px;
  max-width: 900px;
  width: 100%;
  margin: 0 auto;
}

.input-box {
  display: flex;
  gap: 10px;
  background: #111927;
  border: 1px solid #26344b;
  border-radius: 14px;
  padding: 10px;
}

input {
  flex: 1;
  min-width: 0;
  background: transparent;
  border: none;
  outline: none;
  color: white;
  padding: 10px;
  font-size: 16px;
}

button.send {
  border: none;
  border-radius: 10px;
  padding: 12px 18px;
  background: #1685f8;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: 0.5;
}

.note {
  color: #8793a8;
  font-size: 12px;
  text-align: center;
  margin-top: 12px;
}

@media(max-width: 600px) {
  .sidebar {
    width: 125px;
    padding: 12px 8px;
  }
  .logo {
    font-size: 19px;
  }
  .mode, .new-chat {
    font-size: 12px;
    padding: 10px 7px;
  }
  #messages {
    padding: 15px;
  }
  .welcome h1 {
    font-size: 28px;
  }
}
</style>
</head>

<body>
<div class="app">

  <aside class="sidebar">
    <div class="logo">⚡ SKITZ AI</div>

    <button class="new-chat" onclick="newChat()">＋ New Chat</button>

    <p style="color:#8492a8;font-size:12px;">MODES</p>

    <button class="mode active" id="chatMode"
      onclick="setMode('chat')">💬 AI Chat</button>

    <button class="mode" id="devMode"
      onclick="setMode('dev')">💻 Developer AI</button>

    <div style="margin-top:30px;color:#66758c;font-size:12px;">
      VERSION 1.0<br><br>
      Built by SKITZ
    </div>
  </aside>

  <main class="main">
    <header id="header">💬 AI Chat</header>

    <section id="messages">
      <div class="welcome" id="welcome">
        <h1>What's up? <span class="blue">👋</span></h1>
        <p style="color:#9ba9bd;">
          Welcome to SKITZ AI. What are we working on today?
        </p>
      </div>
    </section>

    <div class="input-area">
      <div class="input-box">
        <input id="prompt" placeholder="Message SKITZ AI..."
          autocomplete="off">
        <button class="send" id="send" onclick="sendMessage()">Send</button>
      </div>
      <div class="note">
        SKITZ AI Preview • This version uses demo responses, not a live AI model.
      </div>
    </div>
  </main>

</div>

<script>
let currentMode = "chat";

function setMode(mode) {
  currentMode = mode;

  document.getElementById("chatMode").classList.toggle(
    "active", mode === "chat"
  );

  document.getElementById("devMode").classList.toggle(
    "active", mode === "dev"
  );

  document.getElementById("header").textContent =
    mode === "chat" ? "💬 AI Chat" : "💻 Developer AI";

  document.getElementById("prompt").placeholder =
    mode === "chat"
      ? "Ask SKITZ AI anything..."
      : "Ask about coding, Roblox, or game development...";
}

function addMessage(text, type) {
  const messages = document.getElementById("messages");
  const welcome = document.getElementById("welcome");

  if (welcome) welcome.remove();

  const div = document.createElement("div");
  div.className = "message " + type;
  div.textContent = text;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

function getDemoResponse(text) {
  const q = text.toLowerCase();

  if (currentMode === "dev") {
    if (q.includes("roblox") || q.includes("lua")) {
      return "ROBLOX DEV MODE 💻\n\nI can help you plan Roblox games, write Lua examples, design UI, and debug scripts.\n\nTell me what you're building and share any code or error you're working on.";
    }

    if (q.includes("error") || q.includes("bug")) {
      return "DEBUGGING MODE 🔧\n\n1. Find the exact error message.\n2. Check the line mentioned in the error.\n3. Look for missing brackets, misspelled names, or incorrect values.\n\nPaste your error here and we'll investigate it.";
    }

    return "DEVELOPER MODE 💻\n\nLet's build something!\n\nI can help plan game mechanics, create sample code, design menus, and explain programming concepts.\n\nWhat language or game engine are you using?";
  }

  if (q.includes("hello") || q.includes("hey") || q.includes("yo")) {
    return "Yo! ⚡ Welcome to SKITZ AI. What can I help you with?";
  }

  if (q.includes("what can you do")) {
    return "I can demonstrate chat features, help organize ideas, and guide you through coding projects.\n\nThis preview uses preset responses. Connecting a real AI model is our next major upgrade.";
  }

  return "I got your message! ⚡\n\nThis is the SKITZ AI preview, so my responses are currently demonstrations rather than real AI-generated answers.\n\nOur next upgrade is connecting a real AI model so I can answer your questions dynamically.";
}

function sendMessage() {
  const input = document.getElementById("prompt");
  const button = document.getElementById("send");
  const text = input.value.trim();

  if (!text || button.disabled) return;

  addMessage(text, "user");
  input.value = "";

  button.disabled = true;
  button.textContent = "...";

  setTimeout(() => {
    addMessage(getDemoResponse(text), "assistant");
    button.disabled = false;
    button.textContent = "Send";
    input.focus();
  }, 400);
}

function newChat() {
  document.getElementById("messages").innerHTML =
    '<div class="welcome" id="welcome">' +
    '<h1>What\'s up? <span class="blue">👋</span></h1>' +
    '<p style="color:#9ba9bd;">Welcome to SKITZ AI. What are we working on today?</p>' +
    '</div>';
}

document.getElementById("prompt").addEventListener("keydown", e => {
  if (e.key === "Enter") sendMessage();
});
</script>
</body>
</html>
